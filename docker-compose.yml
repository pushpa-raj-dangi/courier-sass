services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: courier
      POSTGRES_PASSWORD: courier_dev_password
      POSTGRES_DB: courier
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courier"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8025/api/v2/messages"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=courier;Username=courier;Password=courier_dev_password"
      ConnectionStrings__Redis: "redis:6379"
      ConnectionStrings__RabbitMq: "amqp://guest:guest@rabbitmq:5672"
      SMTP__HOST: "mailhog"
      SMTP__PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_healthy

  web:
    build:
      context: src/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Server-side only (src/web/src/lib/env.ts) — the API's address on the Docker network,
      # not the host-mapped port ("http://localhost:5001" is unreachable from inside this
      # container). Deliberately not NEXT_PUBLIC_-prefixed: see env.ts for why that prefix
      # would bake in whatever value happened to be in a local .env.local at image build time
      # and ignore this at runtime.
      API_BASE_URL: "http://api:8080"
    depends_on:
      - api

volumes:
  postgres-data:
